name: Unione automatica degli articoli

# Unisce le PR degli articoli scritti dall'agente (etichetta `articolo-automatico`) dopo
# 48 ore, se il titolare non le ha fermate. Condizioni, TUTTE:
#   - aperta da almeno 48 ore;
#   - senza l'etichetta `fermo`, non in bozza, senza «Request changes»;
#   - controllo editoriale e build ripetuti qui sul contenuto attuale della PR (il
#     titolare potrebbe averla corretta, e le PR aperte da GITHUB_TOKEN non fanno partire
#     la CI);
#   - anteprima di Vercel della landing riuscita.
# L'unione genera il push su main che Vercel rilascia.

on:
  schedule:
    - cron: "0 5 * * *" # ogni giorno, 05:00 UTC
  workflow_dispatch:

concurrency:
  group: articoli-automerge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  unisci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: PR pronte
        id: pronte
        run: |
          ADESSO=$(date -u +%s)
          PRONTE=$(gh pr list --label articolo-automatico --state open --json number,createdAt,isDraft,labels,reviewDecision \
            --jq ".[] | select(.isDraft | not) | select([.labels[].name] | index(\"fermo\") | not) | select(.reviewDecision != \"CHANGES_REQUESTED\") | select(($ADESSO - (.createdAt | fromdateiso8601)) >= 172800) | .number")
          echo "pronte: ${PRONTE:-nessuna}"
          echo "numeri=$(echo $PRONTE)" >> "$GITHUB_OUTPUT"

      - name: Verifica e unione
        if: steps.pronte.outputs.numeri != ''
        run: |
          for N in ${{ steps.pronte.outputs.numeri }}; do
            echo "::group::PR #$N"
            git checkout -q main
            gh pr checkout "$N"
            SHA=$(git rev-parse HEAD)
            # Anteprima di Vercel della landing: deve essere riuscita.
            VERCEL=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" --jq '[.statuses[] | select(.context | test("pmiflow-landing")) | .state] | first // "assente"')
            if [ "$VERCEL" != "success" ]; then echo "PR #$N: anteprima Vercel $VERCEL, la lascio aperta"; echo "::endgroup::"; continue; fi
            if ! (cd landing && npm ci --no-audit --no-fund >/dev/null && npm run verifica-articoli && BLOG_ANTEPRIMA=1 npx next build >/dev/null); then
              echo "PR #$N: controllo o build falliti, la lascio aperta"
              gh pr comment "$N" --body "Unione automatica sospesa: il controllo editoriale o il build non passano. Vedi l'esecuzione ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "::endgroup::"; continue
            fi
            gh pr merge "$N" --merge --delete-branch && echo "PR #$N unita"
            echo "::endgroup::"
          done
