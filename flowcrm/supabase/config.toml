# Configurazione Supabase CLI — SOLO locale, nessun collegamento remoto.
# Il link al progetto istanza avviene esplicitamente con `supabase link`.
project_id = "flowcrm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

[auth.email]
# Provider email ACCESO: qui `enable_signup` governa il provider, non solo la
# registrazione — con false ogni login risponde 422 email_provider_disabled e
# la suite end-to-end non può nemmeno autenticarsi. L'auto-registrazione resta
# comunque bloccata da `enable_signup = false` nella sezione [auth] sopra.
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

# ── Edge Functions ──────────────────────────────────────────────────
# `health` è l'UNICA funzione aperta: una sonda di uptime non può portarsi
# dietro un JWT, e un health check autenticato non saprebbe dire se è caduta
# proprio l'autenticazione. La risposta è content-free (vedi la funzione).
# Tutte le altre restano con verify_jwt al default `true`.
[functions.health]
verify_jwt = false
