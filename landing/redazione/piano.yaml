# Piano editoriale del blog di PMIFlow.
#
# L'agente di redazione (skill `redazione-pmiflow`, modalità `scrivi`) prende la PRIMA
# voce con `stato: da-scrivere`, la scrive, e la segna `scritto` con lo slug e la data.
# L'ordine è la priorità: settori alternati, argomenti stagionali prima della stagione.
#
# Parole chiave dalle ricerche reali (autocompletamento di Google, 29/09/2026). Niente
# volumi: servirebbero strumenti a pagamento. Da novembre 2026 il piano si aggiorna ogni
# mese con i dati di Search Console (modalità `pianifica`).
#
# Regole: una parola chiave per articolo, mai la stessa due volte (il controllo lo
# impedisce); ogni settore ha almeno 4 articoli che portano alla sua pagina /moduli/<id>.
#
# Campi: slug, settore, titolo (provvisorio, l'agente può migliorarlo), parolaChiave,
# correlate (da usare nel testo), intento (informativo | pratico | scelta), angolo (cosa
# deve avere l'articolo per essere migliore di quello che c'è già), stato, data.

